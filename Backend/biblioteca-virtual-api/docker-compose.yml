version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: biblioteca_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-bibliotecauser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biblioteca2024}
      POSTGRES_DB: ${DB_NAME:-biblioteca_virtual}
      POSTGRES_INITDB_ARGS: "-c timezone=America/Guatemala"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/scripts:/docker-entrypoint-initdb.d
    networks:
      - biblioteca_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bibliotecauser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: biblioteca_app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bibliotecauser}
      DB_PASSWORD: ${DB_PASSWORD:-biblioteca2024}
      DB_NAME: ${DB_NAME:-biblioteca_virtual}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - biblioteca_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  biblioteca_network:
    driver: bridge
